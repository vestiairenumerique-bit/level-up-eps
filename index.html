<style>
  html,body{margin:0;padding:0;background:transparent}

  body.app-body{min-height:100vh;padding:18px 10px;background:radial-gradient(circle at 50% 0,#254672 0,#0c1930 54%,#071122 100%)}
  #level-up-eps{--navy:#10203c;--panel:#f4f8fc;--cyan:#58c8e8;--red:#f04464;max-width:680px;padding:16px;border:1px solid rgba(121,213,239,.35);border-radius:28px;background:linear-gradient(165deg,#17345a,#0b1b35 72%);color:#fff;box-shadow:0 22px 70px rgba(0,0,0,.35);text-align:center}

  function points(){return Object.values(week).filter(Boolean).length}
  function isPerfect(index){return habits.every((_,h)=>week[`${h}-${index}`])}
  function syncPerfectDays(){if(dayIndex>4)return;const date=new Date(monday);date.setDate(date.getDate()+dayIndex);const k=keyDate(date),set=new Set(profile.perfectDays||[]);if(isPerfect(dayIndex))set.add(k);else set.delete(k);profile.perfectDays=[...set].sort()}
  function streak(){const set=new Set(profile.perfectDays||[]);let end=new Date(now);end.setHours(0,0,0,0);if(dayIndex>4)end=previousSchoolDay(end);else if(!set.has(keyDate(end)))end=previousSchoolDay(end);if(!set.has(keyDate(end)))return 0;let total=0,d=end;while(set.has(keyDate(d))){total++;d=previousSchoolDay(d)}return total}
  function habitCount(index){return days.reduce((total,_,di)=>total+(week[`${index}-${di}`]?1:0),0)}
  function chartRows(){return habits.map((h,index)=>{const count=habitCount(index);return `<div class="bar-row"><span>${h.icon} ${h.name}</span><div class="bar-track" role="progressbar" aria-label="${h.name}" aria-valuemin="0" aria-valuemax="5" aria-valuenow="${count}"><div class="bar-fill" style="width:${count*20}%"></div></div><span class="bar-value">${count}/5</span></div>`}).join("")}
  function exportProgress(){const data={format:"level-up-eps",version:1,exportedAt:new Date().toISOString(),items:{}};for(let i=0;i<localStorage.length;i++){const key=localStorage.key(i);if(key&&key.startsWith("level-up-"))data.items[key]=localStorage.getItem(key)}const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="progression-level-up-eps.json";a.click();URL.revokeObjectURL(url)}
  function importProgress(file){const reader=new FileReader();reader.onload=()=>{try{const data=JSON.parse(reader.result);if(data.format!=="level-up-eps"||!data.items)throw new Error();Object.entries(data.items).forEach(([key,value])=>{if(key.startsWith("level-up-")&&typeof value==="string")localStorage.setItem(key,value)});location.reload()}catch(e){alert("Ce fichier de sauvegarde n’est pas valide.")}};reader.readAsText(file)}
  function resetProgress(){if(confirm("Effacer toute la progression LEVEL UP enregistrée sur cet appareil ?")){const keys=[];for(let i=0;i<localStorage.length;i++){const key=localStorage.key(i);if(key&&key.startsWith("level-up-"))keys.push(key)}keys.forEach(key=>localStorage.removeItem(key));location.reload()}}
  function maybeLevelUp(){if(points()===25&&!profile.awardedWeeks.includes(weekKey)){profile.level++;profile.awardedWeeks.push(weekKey);save();return true}return false}
  function render(){
    const p=points(),hearts=Array.from({length:5},(_,i)=>buildHeart(Math.max(0,Math.min(5,p-i*5)),i)).join("");
    const active=dayIndex<5,move=active?moves[dayIndex]:"Reviens lundi pour une nouvelle activité.",moveDone=active&&!!week[`1-${dayIndex}`];
    const dayName=active?days[dayIndex]:"Week-end";
    const rows=habits.map((h,hi)=>{const k=`${hi}-${dayIndex}`,on=active&&!!week[k],locked=!active||hi===1;return `<div class="daily-row"><span>${h.icon} ${h.name}</span><button class="check ${on?"on":""}" type="button" data-key="${k}" aria-label="${h.name}, ${dayName}${hi===1?", à valider avec le bouton J’ai bougé":""}" aria-pressed="${on}" ${locked?"disabled":""}>${on?"✓":hi===1?"·":""}</button></div>`}).join("");
    root.innerHTML=`<div class="app-head"><img class="app-logo" src="./logo-app.png" alt="Logo LEVEL UP"><div class="brand">LEVEL <em>UP</em></div></div><div class="stats"><div class="stat-card"><span class="stat-icon">▥</span><span class="stat-copy">NIVEAU<b class="level">${profile.level}</b></span></div><div class="stat-card"><span class="stat-icon">🔥</span><span class="stat-copy">SÉRIE<b class="streak">${streak()}</b></span></div><div class="stat-card"><span class="stat-icon">🏆</span><span class="stat-copy">RECORD<b>${profile.bestStreak||0}</b></span></div></div><div class="hero-progress"><div class="avatar-wrap">${avatar}</div><div class="progress-copy"><div class="hearts">${hearts}</div><div class="xp"><strong>${p} / 25</strong> POINTS CETTE SEMAINE</div></div></div><div class="daily"><div class="daily-head"><span>AUJOURD’HUI</span><span>${dayName}</span></div>${rows}</div><div class="move-card"><div class="move-title">🏃 BOUGER AUJOURD’HUI</div><div class="move-text">${move}</div>${active?`<button class="move-button ${moveDone?"done":""}" type="button">${moveDone?"✓ ACTIVITÉ RÉALISÉE":"J’AI BOUGÉ"}</button>`:""}</div><div class="chart"><div class="chart-title">MES 5 HABITUDES — CETTE SEMAINE</div>${chartRows()}</div><div class="tools"><button class="tool-button export-button" type="button">▣ SAUVEGARDER</button><label class="tool-button" for="progress-file">↻ RESTAURER</label><input class="file-input" id="progress-file" type="file" accept="application/json"><button class="tool-button danger reset-button" type="button">⌫ EFFACER</button></div><div class="message" aria-live="polite">${p===25?"5 CŒURS — LEVEL UP !":"Chaque petit pas compte."}</div><div class="privacy">🔒 Progression enregistrée uniquement sur cet appareil. Pense à la sauvegarder avant de changer de téléphone ou de navigateur.</div>`;
    bind();
  }
  function update(key,value){week[key]=value;syncPerfectDays();const current=streak();profile.bestStreak=Math.max(profile.bestStreak||0,current);save();const leveled=maybeLevelUp();render();if(leveled){root.querySelector(".avatar").classList.add("levelup");root.querySelector(".message").textContent="⚡ LEVEL UP ! NIVEAU "+profile.level}}
  function bind(){root.querySelectorAll(".check").forEach(b=>b.addEventListener("click",()=>update(b.dataset.key,!week[b.dataset.key])));const moveButton=root.querySelector(".move-button");if(moveButton)moveButton.addEventListener("click",()=>update(`1-${dayIndex}`,!week[`1-${dayIndex}`]));root.querySelector(".export-button").addEventListener("click",exportProgress);root.querySelector("#progress-file").addEventListener("change",e=>{if(e.target.files[0])importProgress(e.target.files[0])});root.querySelector(".reset-button").addEventListener("click",resetProgress)}
  render();
})();
</script>
