  function points(data=week){let total=0;for(let h=0;h<habits.length;h++)for(let d=0;d<5;d++)if(data[`${h}-${d}`])total++;return total}
  function dayPoints(index){return habits.reduce((total,_,h)=>total+(week[`${h}-${index}`]?1:0),0)}
  function syncStreakDays(){if(dayIndex>4)return;const date=new Date(monday);date.setDate(date.getDate()+dayIndex);const k=keyDate(date),set=new Set(Array.isArray(profile.streakDays)?profile.streakDays:(profile.perfectDays||[]));if(dayPoints(dayIndex)>=3)set.add(k);else set.delete(k);profile.streakDays=[...set].sort()}
  function streak(){const set=new Set(profile.streakDays||[]);let end=new Date(now);end.setHours(0,0,0,0);if(dayIndex>4)end=previousSchoolDay(end);else if(!set.has(keyDate(end)))end=previousSchoolDay(end);if(!set.has(keyDate(end)))return 0;let total=0,d=end;while(set.has(keyDate(d))){total++;d=previousSchoolDay(d)}return total}
  function habitCount(index){return days.reduce((total,_,di)=>total+(week[`${index}-${di}`]?1:0),0)}
  function season(){const y=now.getFullYear(),start=now.getMonth()>=8?y:y-1;return {start,end:start+1,label:`SAISON ${start}–${start+1}`}}
  function totalPoints(){const s=season();let total=0;try{for(let i=0;i<localStorage.length;i++){const key=localStorage.key(i);if(!key||!key.startsWith("level-up-week-"))continue;const match=key.match(/(\d{4})-(\d{2})-(\d{2})$/);if(!match)continue;const mon=new Date(+match[1],+match[2]-1,+match[3]),fri=new Date(mon);fri.setDate(mon.getDate()+4);const from=new Date(s.start,8,1),to=new Date(s.end,5,30,23,59,59);if(fri>=from&&mon<=to)total+=points(JSON.parse(localStorage.getItem(key)||"{}"))}}catch(e){}return total}
  function totalXp(){return totalPoints()+(Number(profile.bonusXp)||0)}
  function applyStreakFreeze(){if((profile.streakFreeze||0)<1)return;const dates=(profile.streakDays||[]).filter(k=>k<keyDate(now)).sort();if(!dates.length)return;const parts=dates[dates.length-1].split("-").map(Number),last=new Date(parts[0],parts[1]-1,parts[2]),missed=nextSchoolDay(last),today=new Date(now);today.setHours(0,0,0,0);if(missed<today){const k=keyDate(missed);profile.streakDays=[...new Set([...(profile.streakDays||[]),k])].sort();profile.frozenDays=[...new Set([...(profile.frozenDays||[]),k])];profile.streakFreeze=0;profile.freezeNotice=k;save()}}

  function challengeOf(date){const epoch=new Date(2026,8,1);let cursor=new Date(epoch),schoolDays=0,target=new Date(date);cursor.setHours(0,0,0,0);target.setHours(0,0,0,0);while(cursor<target){cursor.setDate(cursor.getDate()+1);if(cursor.getDay()!==0&&cursor.getDay()!==6)schoolDays++}return challenges[((schoolDays%challenges.length)+challenges.length)%challenges.length]}
  const difficulty={jumping:["15 secondes de jumping jacks","25 secondes de jumping jacks","35 secondes de jumping jacks","45 secondes de jumping jacks"],knees:["15 secondes de montées de genoux","25 secondes de montées de genoux","35 secondes de montées de genoux","45 secondes de montées de genoux"],hops:["15 sautillements légers","20 sautillements légers","30 sautillements contrôlés","40 sautillements contrôlés"],squat:["5 squats contrôlés","8 squats contrôlés","12 squats contrôlés","15 squats contrôlés"],wall:["Chaise pendant 15 secondes","Chaise pendant 25 secondes","Chaise pendant 35 secondes","Chaise pendant 45 secondes"],plank:["Gainage pendant 10 secondes","Gainage pendant 20 secondes","Gainage pendant 30 secondes","Gainage pendant 40 secondes"],lunges:["4 fentes alternées","6 fentes alternées","10 fentes alternées","14 fentes alternées"],burpee:["2 burpees sans saut","4 burpees à ton rythme","6 burpees à ton rythme","8 burpees, saut facultatif"],balance:["Équilibre 15 secondes près d’un appui","Équilibre 25 secondes sur un pied","Équilibre 35 secondes sur un pied","Équilibre 45 secondes sur un pied"],stairs:["Prends une volée d’escaliers","Prends deux volées d’escaliers","Prends trois volées d’escaliers","Prends quatre volées d’escaliers"],walk:["Marche activement 5 minutes","Marche activement 8 minutes","Marche activement 12 minutes","Marche activement 15 minutes"],carry:["Aide avec une charge légère","Aide à porter une charge adaptée","Porte une partie des courses","Aide à porter les courses à ton rythme"]};

  function challengeKind(c){const n=c.name.toLowerCase();if(n.includes("jumping"))return "jumping";if(n.includes("genoux"))return "knees";if(n.includes("sautil"))return "hops";if(n.includes("squat"))return "squat";if(n.includes("chaise"))return "wall";if(n.includes("gainage"))return "plank";if(n.includes("fente"))return "lunges";if(n.includes("burpee"))return "burpee";if(n.includes("équilibre")||n.includes("pied"))return "balance";if(n.includes("escalier"))return "stairs";if(n.includes("marche"))return "walk";return "carry"}

  function rewardCard(){if(points()<25)return "";const reward=(profile.bagRewards||{})[weekKey];if(!reward)return `<div class="reward-card"><div class="reward-copy"><b>🎒 SAC DE SPORT DÉBLOQUÉ !</b>Semaine parfaite : ouvre ta récompense.</div><button class="reward-bag" type="button">OUVRIR</button></div>`;const label=reward==="freeze"?"🧊 Gel de série obtenu":"⚡ 5 XP cadeaux obtenus";return `<div class="reward-card opened"><div class="reward-copy"><b>${label}</b>Récompense de ta semaine à 25/25.</div></div>`}
