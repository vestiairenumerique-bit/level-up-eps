  function totalPoints(){const s=season();let total=0;try{for(let i=0;i<localStorage.length;i++){const key=localStorage.key(i);if(!key||!key.startsWith("level-up-week-"))continue;const match=key.match(/(\d{4})-(\d{2})-(\d{2})$/);if(!match)continue;const mon=new Date(+match[1],+match[2]-1,+match[3]),fri=new Date(mon);fri.setDate(mon.getDate()+4);const from=new Date(s.start,8,1),to=new Date(s.end,5,30,23,59,59);if(fri>=from&&mon<=to)total+=points(JSON.parse(localStorage.getItem(key)||"{}"))}}catch(e){}return total}

  function challengeOf(date){const epoch=new Date(2026,8,1);let cursor=new Date(epoch),schoolDays=0,target=new Date(date);cursor.setHours(0,0,0,0);target.setHours(0,0,0,0);while(cursor<target){cursor.setDate(cursor.getDate()+1);if(cursor.getDay()!==0&&cursor.getDay()!==6)schoolDays++}return challenges[((schoolDays%challenges.length)+challenges.length)%challenges.length]}
  const difficulty={jumping:["15 secondes de jumping jacks","25 secondes de jumping jacks","35 secondes de jumping jacks","45 secondes de jumping jacks"],knees:["15 secondes de montées de genoux","25 secondes de montées de genoux","35 secondes de montées de genoux","45 secondes de montées de genoux"],hops:["15 sautillements légers","20 sautillements légers","30 sautillements contrôlés","40 sautillements contrôlés"],squat:["5 squats contrôlés","8 squats contrôlés","12 squats contrôlés","15 squats contrôlés"],wall:["Chaise pendant 15 secondes","Chaise pendant 25 secondes","Chaise pendant 35 secondes","Chaise pendant 45 secondes"],plank:["Gainage pendant 10 secondes","Gainage pendant 20 secondes","Gainage pendant 30 secondes","Gainage pendant 40 secondes"],lunges:["4 fentes alternées","6 fentes alternées","10 fentes alternées","14 fentes alternées"],burpee:["2 burpees sans saut","4 burpees à ton rythme","6 burpees à ton rythme","8 burpees, saut facultatif"],balance:["Équilibre 15 secondes près d’un appui","Équilibre 25 secondes sur un pied","Équilibre 35 secondes sur un pied","Équilibre 45 secondes sur un pied"],stairs:["Prends une volée d’escaliers","Prends deux volées d’escaliers","Prends trois volées d’escaliers","Prends quatre volées d’escaliers"],walk:["Marche activement 5 minutes","Marche activement 8 minutes","Marche activement 12 minutes","Marche activement 15 minutes"],carry:["Aide avec une charge légère","Aide à porter une charge adaptée","Porte une partie des courses","Aide à porter les courses à ton rythme"]};
  const adapted={jumping:"Marche sur place pendant 20 secondes",knees:"Marche sur place en levant les genoux",hops:"Monte sur la pointe des pieds 15 fois",squat:"Fais 5 demi-squats avec un appui",wall:"Tiens la chaise 10 secondes",plank:"Fais un gainage mains contre le mur",lunges:"Fais 4 pas fendus avec un appui",burpee:"Fais 2 burpees sans saut",balance:"Tiens 10 secondes près d’un appui",stairs:"Marche tranquillement pendant 3 minutes",walk:"Marche tranquillement pendant 5 minutes",carry:"Aide avec une charge très légère"};
  function challengeKind(c){const n=c.name.toLowerCase();if(n.includes("jumping"))return "jumping";if(n.includes("genoux"))return "knees";if(n.includes("sautil"))return "hops";if(n.includes("squat"))return "squat";if(n.includes("chaise"))return "wall";if(n.includes("gainage"))return "plank";if(n.includes("fente"))return "lunges";if(n.includes("burpee"))return "burpee";if(n.includes("équilibre")||n.includes("pied"))return "balance";if(n.includes("escalier"))return "stairs";if(n.includes("marche"))return "walk";return "carry"}
  function challengeLevel(levelNumber,c){const rank=Math.min(3,Math.floor((levelNumber-1)/3)),names=["Découverte","Progression","Maîtrise","Légende"],kind=challengeKind(c);return {rank,name:names[rank],text:difficulty[kind][rank],adapted:adapted[kind]}}
  function characterPicker(){return `<button class="character-action" type="button">CHOISIR MON PERSONNAGE</button>${pickerOpen?`<div class="character-picker" aria-label="Choisir mon personnage">${characters.map((c,i)=>`<button class="character-choice ${profile.character===c.id?"on":""}" type="button" data-character="${c.id}" aria-label="Personnage ${i+1}"><img src="./assets/characters/${c.id}-victory.png" alt=""></button>`).join("")}</div>`:""}`}
  function chartRows(){return habits.map((h,index)=>{const count=habitCount(index);return `<div class="bar-row"><span>${h.icon} ${h.name}</span><div class="bar-track" role="progressbar" aria-label="${h.name}" aria-valuemin="0" aria-valuemax="5" aria-valuenow="${count}"><div class="bar-fill" style="width:${count*20}%"></div></div><span class="bar-value">${count}/5</span></div>`}).join("")}
  function exportProgress(){const data={format:"level-up-eps",version:1,exportedAt:new Date().toISOString(),items:{}};for(let i=0;i<localStorage.length;i++){const key=localStorage.key(i);if(key&&key.startsWith("level-up-"))data.items[key]=localStorage.getItem(key)}const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="progression-level-up-eps.json";a.click();URL.revokeObjectURL(url)}
  function importProgress(file){const reader=new FileReader();reader.onload=()=>{try{const data=JSON.parse(reader.result);if(data.format!=="level-up-eps"||!data.items)throw new Error();Object.entries(data.items).forEach(([key,value])=>{if(key.startsWith("level-up-")&&typeof value==="string")localStorage.setItem(key,value)});location.reload()}catch(e){alert("Ce fichier de sauvegarde n’est pas valide.")}};reader.readAsText(file)}
  function resetProgress(){if(confirm("Effacer toute la progression LEVEL UP enregistrée sur cet appareil ?")){const keys=[];for(let i=0;i<localStorage.length;i++){const key=localStorage.key(i);if(key&&key.startsWith("level-up-"))keys.push(key)}keys.forEach(key=>localStorage.removeItem(key));location.reload()}}
  function render(){
    const p=points(),total=totalPoints(),level=levelInfo(total),hearts=Array.from({length:5},(_,i)=>buildHeart(Math.max(0,Math.min(5,p-i*5)),i)).join("");
    profile.level=level.number;save();
    const active=dayIndex<5,challenge=challengeOf(now),levelChallenge=challengeLevel(level.number,challenge),move=active?levelChallenge.text:"Reviens lundi pour une nouvelle activité.",moveSource=week[`move-source-${dayIndex}`]||"";
    const dayName=active?days[dayIndex]:"Week-end";
    const rows=habits.map((h,hi)=>{const k=`${hi}-${dayIndex}`,on=active&&!!week[k],locked=!active||hi===1;return `<div class="daily-row"><span>${h.icon} ${h.name}</span><button class="check ${on?"on":""}" type="button" data-key="${k}" aria-label="${h.name}, ${dayName}${hi===1?", à valider avec le bouton J’ai bougé":""}" aria-pressed="${on}" ${locked?"disabled":""}>${on?"✓":hi===1?"·":""}</button></div>`}).join("");
    const char=characters.some(c=>c.id===profile.character)?profile.character:"nova",pose=active?challenge.pose:"victory",nextText=level.next?`${total} / ${level.next.xp} XP vers ${level.next.name}`:`${total} XP — niveau maximal`;
    root.innerHTML=`<div class="app-head"><img class="app-logo" src="./logo-app.png" alt="Logo LEVEL UP"><div class="brand">LEVEL <em>UP</em></div></div><div class="season">${season().label}</div><div class="stats"><div class="stat-card"><span class="stat-icon">▥</span><span class="stat-copy">NIVEAU<b class="level">${level.number}</b><small>${level.current.name}</small></span></div><div class="stat-card"><span class="stat-icon">🔥</span><span class="stat-copy">SÉRIE<b class="streak">${streak()}</b><small>JOURS À 3 / 5</small></span></div></div><div class="hero-progress"><div class="avatar-wrap"><img class="avatar" src="./assets/characters/${char}-victory.png" alt="Mon personnage"></div><div class="progress-copy"><div class="hearts">${hearts}</div><div class="xp"><strong>${p} / 25</strong> POINTS CETTE SEMAINE</div><div class="week-meter" role="progressbar" aria-label="Progression de la semaine" aria-valuemin="0" aria-valuemax="25" aria-valuenow="${p}"><div class="week-meter-fill" style="width:${p*4}%"></div></div><div class="level-progress">${nextText}</div></div></div>${characterPicker()}<div class="daily"><div class="daily-head"><span>AUJOURD’HUI</span><span>${dayName}</span></div>${rows}</div><div class="move-card"><div class="move-layout"><img class="move-avatar" src="./assets/characters/${char}-${pose}.png" alt="Illustration : ${move}"><div><div class="move-title">🏃 BOUGER AUJOURD’HUI</div><div class="move-text"><b>${active?challenge.family+" — ":""}</b>${move}</div>${active?`<div class="move-choices"><button class="move-choice ${moveSource==="challenge"?"on":""}" data-source="challenge" type="button">${moveSource==="challenge"?"✓ ":""}DÉFI DU JOUR</button><button class="move-choice ${moveSource==="club"?"on":""}" data-source="club" type="button">${moveSource==="club"?"✓ ":""}SPORT EN CLUB</button><button class="move-choice ${moveSource==="eps"?"on":""}" data-source="eps" type="button">${moveSource==="eps"?"✓ ":""}COURS D’EP&amp;S</button></div>`:""}</div></div></div><div class="chart"><div class="chart-title">MES 5 HABITUDES — CETTE SEMAINE</div>${chartRows()}</div><div class="tools"><button class="tool-button export-button" type="button">▣ SAUVEGARDER</button><label class="tool-button" for="progress-file">↻ RESTAURER</label><input class="file-input" id="progress-file" type="file" accept="application/json"><button class="tool-button danger reset-button" type="button">⌫ EFFACER</button></div><div class="message" aria-live="polite">${p===25?"5 CŒURS — SEMAINE COMPLÈTE !":dayPoints(dayIndex)>=3?"🔥 Ta série continue !":"Chaque petit pas compte."}</div><div class="privacy">🔒 Progression enregistrée uniquement sur cet appareil. Pense à la sauvegarder avant de changer de téléphone ou de navigateur.</div>`;
    if(active){root.querySelector(".move-title").innerHTML=`🏃 MISSION DU JOUR <span class="rank-pill">RANG ${levelChallenge.name.toUpperCase()}</span>`;root.querySelector(".move-text").innerHTML=`<b>${challenge.family}</b> — ${levelChallenge.text}<small>Alternative accessible : ${levelChallenge.adapted}</small>`;const choices=root.querySelector(".move-choices");choices.querySelector('[data-source="challenge"]').textContent=(moveSource==="challenge"?"✓ ":"")+"DÉFI ACCOMPLI";choices.querySelector('[data-source="challenge"]').insertAdjacentHTML("afterend",`<button class="move-choice ${moveSource==="adapted"?"on":""}" data-source="adapted" type="button">${moveSource==="adapted"?"✓ ":""}VERSION ADAPTÉE</button>`);if(dayPoints(dayIndex)>=3)root.querySelector(".daily").insertAdjacentHTML("afterend",`<button class="finish-button" type="button">${week[`finished-${dayIndex}`]?"VOIR MON BILAN":"TERMINER MA JOURNÉE"}</button>`)}
    root.querySelector(".app-logo")?.remove();root.querySelector(".stats .stat-card:first-child .stat-icon")?.remove();const brand=root.querySelector(".brand");brand.innerHTML='<img class="brand-wordmark" src="./logo-wordmark.png" alt="LeVel Up">';brand.setAttribute("aria-label","LeVel Up");
    bind();
  }
  function update(key,value){const before=profile.level||1,beforeDay=dayPoints(dayIndex);week[key]=value;week[`finished-${dayIndex}`]=false;syncStreakDays();const current=streak();profile.bestStreak=Math.max(profile.bestStreak||0,current);save();profile.level=levelInfo(totalPoints()).number;const leveled=profile.level>before;save();render();const character=root.querySelector(".avatar");character.classList.add(leveled?"levelup":"react");if(value){root.querySelector(".hero-progress").insertAdjacentHTML("beforeend",'<span class="point-pop">+1 POINT</span>')}if(beforeDay<3&&dayPoints(dayIndex)>=3){root.querySelector(".message").textContent="🔥 SÉRIE SAUVÉE — TU PEUX TERMINER !";root.querySelector(".message").classList.add("streak-burst")}else if(leveled)root.querySelector(".message").textContent="⚡ NIVEAU SUPÉRIEUR — "+levels[profile.level-1].name.toUpperCase()+" !"}
  function updateMove(source){const key=`move-source-${dayIndex}`,same=week[key]===source;week[key]=same?"":source;update(`1-${dayIndex}`,!same)}
  function showSummary(){week[`finished-${dayIndex}`]=true;save();const score=dayPoints(dayIndex),total=totalPoints(),level=levelInfo(total),remaining=level.next?level.next.xp-total:0,char=characters.some(c=>c.id===profile.character)?profile.character:"nova",title=score===5?"MISSION PARFAITE !":score===4?"SUPER JOURNÉE !":"MISSION ACCOMPLIE !",next=level.next?`Encore ${remaining} point${remaining>1?"s":""} avant ${level.next.name}.`:"Tu as atteint le niveau Légende !";root.insertAdjacentHTML("beforeend",`<div class="mission-overlay" role="dialog" aria-modal="true" aria-label="Bilan de la journée"><div class="mission-modal"><img src="./assets/characters/${char}-victory.png" alt="Ton personnage célèbre"><span class="mission-kicker">+${score} POINT${score>1?"S":""} AUJOURD’HUI</span><h2>${title}</h2><div class="mission-score"><b>${score}/5</b><span>habitudes validées</span></div><p>🔥 Série : <b>${streak()} jour${streak()>1?"s":""}</b></p><p class="mission-next">${next}</p><p>Prochaine étape : reviens demain découvrir ton nouveau défi.</p><button class="summary-close primary" type="button">À DEMAIN !</button><button class="summary-close secondary" type="button">MODIFIER MES HABITUDES</button></div></div>`);root.querySelectorAll(".summary-close").forEach(b=>b.addEventListener("click",()=>{root.querySelector(".mission-overlay").remove();render()}))}
  function bind(){root.querySelectorAll(".check").forEach(b=>b.addEventListener("click",()=>update(b.dataset.key,!week[b.dataset.key])));root.querySelectorAll(".move-choice").forEach(b=>b.addEventListener("click",()=>updateMove(b.dataset.source)));root.querySelector(".character-action").addEventListener("click",()=>{pickerOpen=!pickerOpen;render()});root.querySelectorAll(".character-choice").forEach(b=>b.addEventListener("click",()=>{profile.character=b.dataset.character;pickerOpen=false;save();render()}));root.querySelector(".finish-button")?.addEventListener("click",showSummary);root.querySelector(".export-button").addEventListener("click",exportProgress);root.querySelector("#progress-file").addEventListener("change",e=>{if(e.target.files[0])importProgress(e.target.files[0])});root.querySelector(".reset-button").addEventListener("click",resetProgress)}
  render();
})();
